<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart Offer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: #f1f5f9; font-family: Tahoma, Arial, sans-serif; }
        .auth-card { max-width: 460px; margin: 48px auto; border: 0; border-radius: 16px; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
    </style>
</head>
<body>
    {% if site_banner %}<div style="background:#f59e0b;color:#111;text-align:center;font-weight:bold;padding:4px 8px;font-size:14px;">{{ site_banner }}</div>{% endif %}
    <div class="container px-3">
        <div class="card auth-card">
            <div class="card-body p-4">
                <h4 class="mb-3 text-center"><i class="bi bi-shield-lock text-primary"></i> {% block heading %}{% endblock %}</h4>
                {% for message in messages %}<div class="alert alert-{{ message.tags }} py-2">{{ message }}</div>{% endfor %}
                {% if form.non_field_errors %}<div class="alert alert-danger py-2">{% for e in form.non_field_errors %}{{ e }}{% endfor %}</div>{% endif %}
                {% block content %}{% endblock %}
                <div class="text-center mt-3"><a href="{% url 'login' %}" class="small">رجوع لتسجيل الدخول</a></div>
            </div>
        </div>
    </div>
</body>
</html>
