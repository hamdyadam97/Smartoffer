<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}إصدار المشهد{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: #f1f5f9; font-family: Tahoma, Arial, sans-serif; }
        .portal-card { max-width: 640px; margin: 32px auto; border: 0; border-radius: 16px; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
        .portal-head { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; border-radius: 16px 16px 0 0; padding: 24px; text-align: center; }
        .portal-head h1 { font-size: 1.5rem; margin: 0; }
    </style>
</head>
<body>
    {% if site_banner %}<div style="background:#f59e0b;color:#111;text-align:center;font-weight:bold;padding:4px 8px;font-size:14px;">{{ site_banner }}</div>{% endif %}
    <div class="container px-3">
        <div class="card portal-card">
            <div class="portal-head">
                <i class="bi bi-patch-check fs-1"></i>
                <h1>{% block heading %}إصدار مشهد{% endblock %}</h1>
            </div>
            <div class="card-body p-4">{% block content %}{% endblock %}</div>
        </div>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
